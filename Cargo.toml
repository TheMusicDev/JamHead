[package]
name = "jamhead"
version = "0.1.0"
edition = "2021"
description = "Tiny music brains: a read-optimized MusicBrainz-style API"
license = "MIT"
repository = "https://github.com/TheMusicDev/JamHead"

[dependencies]
anyhow = "1"
arc-swap = "1.9.2"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
fst = "0.4.7"
heed = "0.22.1"
levenshtein_automata = "0.2.1"
memmap2 = "0.9.11"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tantivy = "0.26.2"
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net"] }
unicode-normalization = "0.1.25"
uuid = "1.28.0"
xz2 = { version = "0.1.7", features = ["static"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
