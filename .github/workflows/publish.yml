name: Publish image

# Runs only when a version tag is pushed, for example:  git tag v0.1.0 && git push origin v0.1.0
# Normal pushes and pull requests only run ci.yml and publish nothing.
on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/themusicdev/jamhead

jobs:
  # Each CPU type builds on its own machine of that type. Building arm64 on an amd64 machine
  # would work but runs the whole Rust compile under emulation, which is many times slower.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version in Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$tag" != "$crate" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate. Bump Cargo.toml first." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only used here for the OCI labels (source URL, commit, version).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Remember this platform's image digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error

  # Joins the two single-CPU images under one tag, so `docker pull` picks the right one.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the exact version, such as 0.1.0. No `latest`, no `0.1`: a floating tag hides what is running.
      - name: Create the multi-CPU tag
        working-directory: /tmp/digests
        run: |
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_REF_NAME#v}" "${refs[@]}"
      - name: Check the published image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "${IMAGE}:${version}"
          # Smoke test (amd64 runner): build a data dir from the checked-in fixture, serve it, run the health check.
          img="${IMAGE}:${version}"
          docker run --rm -v "$PWD/tests/fixtures/dump:/in:ro" -v jh-data:/data "$img" ingest --input /in --out /data
          docker run -d --name jh -p 8080:8080 -v jh-data:/data "$img"
          for _ in $(seq 1 20); do
            docker exec jh jamhead healthcheck && break
            sleep 1
          done
          docker exec jh jamhead healthcheck
          curl -fsS localhost:8080/v1/meta
      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
